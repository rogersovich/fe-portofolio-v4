# docker-compose.yml
version: '3.8'

services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-app-portfolio:latest
    container_name: app_portfolio
    env_file:
      - .env
    ports:
      - '80:3000'         # host:container
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M     # optional cap
